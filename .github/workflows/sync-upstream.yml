name: Sync upstream agent skills

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: Optional upstream commit SHA (defaults to upstream main)
        required: false
        type: string

concurrency:
  group: sync-upstream
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the port
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Scheduled runs follow upstream main; manual runs can reproduce any exact SHA.
      - name: Resolve upstream commit
        id: upstream
        env:
          INPUT_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          if [ -n "$INPUT_COMMIT" ]; then commit="$INPUT_COMMIT"; else commit="$(git ls-remote https://github.com/addyosmani/agent-skills.git refs/heads/main | cut -f1)"; fi
          if ! [[ "$commit" =~ ^[a-f0-9]{40}$ ]]; then echo "Invalid upstream commit: $commit" >&2; exit 1; fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out upstream source
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: git clone --no-checkout https://github.com/addyosmani/agent-skills.git "$RUNNER_TEMP/agent-skills" && git -C "$RUNNER_TEMP/agent-skills" checkout --detach "$UPSTREAM_COMMIT"
      - name: Synchronize imported content
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
        run: node scripts/sync-upstream.mjs --upstream-root "$RUNNER_TEMP/agent-skills" --commit "$UPSTREAM_COMMIT" --apply
      - name: Validate package
        run: npm test && npm run build && npm run typecheck && npm run lint && npm run format:check
      # Keep one reviewable sync PR and close it when the default branch catches up.
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/sync-agent-skills"
          if git diff --quiet; then
            echo 'No upstream changes to propose.'
            for pr in $(gh pr list --head "$branch" --state open --json number --jq '.[].number'); do
              gh pr close "$pr" --comment 'Closing stale upstream sync PR; the default branch already contains the synchronized state.'
            done
            exit 0
          fi
          git switch -C "$branch"
          git add UPSTREAM.json skills references hooks docs/agents.md agents
          git commit -m "chore: sync agent skills ${UPSTREAM_COMMIT:0:12}"
          git fetch origin "$branch" || true
          git push --force-with-lease="refs/heads/$branch" origin "$branch"
          if ! gh pr view "$branch" --json url >/dev/null 2>&1; then gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "chore: sync agent skills ${UPSTREAM_COMMIT:0:12}" --body "Automated upstream sync from addyosmani/agent-skills at ${UPSTREAM_COMMIT}. Validation passed; review Pi compatibility before merging."; fi
